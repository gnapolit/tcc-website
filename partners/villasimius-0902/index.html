document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"position:absolute;right:-320px;bottom:-380px;width:1000px;height:1000px;border-radius:50%;background:#243D6B\"><\u002Fdiv>\n    <div style=\"position:absolute;left:-180px;top:-200px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(45,74,124,0.75),rgba(27,48,87,0))\"><\u002Fdiv>\n    <div style=\"position:absolute;left:6%;bottom:12%;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,0.06)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1240px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.15fr 0.85fr;gap:72px;align-items:center\">\n      <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">        <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">CREATOR AGENCY \u00b7 SOUTHERN ITALY<\u002Fdiv>\n        <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 40px\"><\u002Fdiv>\n        <h1 style=\"margin:0;font:400 clamp(46px,5.4vw,86px)\u002F1.02 'Palatino Linotype',Palatino,'Book Antiqua',serif;letter-spacing:1px;color:#FFFFFF;text-wrap:balance\">Campaigns made <em style=\"font-style:italic;color:#C4785A\">with<\u002Fem> Southern Italy \u2014 not about it.<\u002Fh1>\n        <div style=\"width:168px;height:2.5px;background:#C4785A;margin:44px 0 28px\"><\u002Fdiv>\n        <p style=\"margin:0;max-width:560px;font:400 19px\u002F1.62 'Calibri','Arial',sans-serif;color:#E8DCC8;text-wrap:pretty\">We manage international creators who actually live here: a community of 50 creators across six regions, and a managed roster. Destinations get resident voices with international audiences, not a production that arrives and leaves.<\u002Fp>\n        <div style=\"display:flex;gap:14px;margin-top:44px;flex-wrap:wrap\">\n          <a href=\"#contact\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#1B3057;background:#C4785A;padding:18px 30px\" style-hover=\"background:#E8DCC8\">START A CONVERSATION<\u002Fa>\n          <a href=\"#network\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#E8DCC8;border:1px solid rgba(255,255,255,0.22);padding:18px 30px\" style-hover=\"border-color:#C4785A;color:#FFFFFF\">SEE THE NETWORK<\u002Fa>\n        <\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">        <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">CREATOR AGENCY \u00b7 SUD ITALIA<\u002Fdiv>\n        <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 40px\"><\u002Fdiv>\n        <h1 style=\"margin:0;font:400 clamp(46px,5.4vw,86px)\u002F1.02 'Palatino Linotype',Palatino,'Book Antiqua',serif;letter-spacing:1px;color:#FFFFFF;text-wrap:balance\">Campagne fatte <em style=\"font-style:italic;color:#C4785A\">con<\u002Fem> il Sud Italia \u2014 non su di esso.<\u002Fh1>\n        <div style=\"width:168px;height:2.5px;background:#C4785A;margin:44px 0 28px\"><\u002Fdiv>\n        <p style=\"margin:0;max-width:560px;font:400 19px\u002F1.62 'Calibri','Arial',sans-serif;color:#E8DCC8;text-wrap:pretty\">Gestiamo creator internazionali che vivono davvero qui: una community di 50 creator in sei regioni, e un roster gestito. Le destinazioni ottengono voci residenti con pubblico internazionale, non una produzione che arriva e riparte.<\u002Fp>\n        <div style=\"display:flex;gap:14px;margin-top:44px;flex-wrap:wrap\">\n          <a href=\"#contact\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#1B3057;background:#C4785A;padding:18px 30px\" style-hover=\"background:#E8DCC8\">INIZIAMO A PARLARE<\u002Fa>\n          <a href=\"#network\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#E8DCC8;border:1px solid rgba(255,255,255,0.22);padding:18px 30px\" style-hover=\"border-color:#C4785A;color:#FFFFFF\">SCOPRI LA RETE<\u002Fa>\n        <\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:relative;aspect-ratio:4\u002F5;border:1px solid rgba(255,255,255,0.1)\">\n        <image-slot id=\"hero-portrait\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop hero image \u2014 creator on location, Amalfi \u002F Naples\" src=\"26ff90d8-32dc-45e1-bbd9-00d5c387a373\"><\u002Fimage-slot>\n        <div style=\"position:absolute;left:-1px;bottom:-1px;background:#1B3057;border-top:1px solid rgba(255,255,255,0.1);border-right:1px solid rgba(255,255,255,0.1);padding:16px 22px;pointer-events:none\">\n          <div style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#C4785A\">EST. 2026 \u00b7 NAPOLI<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"opportunity\" data-screen-label=\"Opportunity\" style=\"position:relative;padding:130px 40px;border-top:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"position:absolute;left:-260px;top:120px;width:760px;height:760px;border-radius:50%;background:#243D6B;opacity:0.55\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1240px;margin:0 auto\">\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">      <div style=\"font:700 13px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">01 \u00b7 THE OPPORTUNITY<\u002Fdiv>\n      <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 44px\"><\u002Fdiv>\n      <h2 style=\"margin:0;max-width:900px;font:400 clamp(34px,3.9vw,60px)\u002F1.14 'Palatino Linotype',Palatino,'Book Antiqua',serif;letter-spacing:1px;color:#FFFFFF;text-wrap:balance\">Villasimius already has an October. It is German and Swiss.<\u002Fh2><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <div style=\"font:700 13px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">01 \u00b7 L'OPPORTUNIT\u00c0<\u002Fdiv>\n      <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 44px\"><\u002Fdiv>\n      <h2 style=\"margin:0;max-width:900px;font:400 clamp(34px,3.9vw,60px)\u002F1.14 'Palatino Linotype',Palatino,'Book Antiqua',serif;letter-spacing:1px;color:#FFFFFF;text-wrap:balance\">Villasimius ha gi\u00e0 un ottobre. \u00c8 tedesco e svizzero.<\u002Fh2><\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:44px;margin-top:64px\">\n        <div style=\"border-top:2px solid #C4785A;padding:26px 0 0\">\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">JULY AND AUGUST, SHARE OF THE YEAR<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">LUGLIO E AGOSTO, QUOTA DELL'ANNO<\u002Fdiv><\u002Fsc-if>\n          <div style=\"font:400 56px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A;margin-top:18px\">50%<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <p style=\"margin:18px 0 0;font:400 16px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Villasimius recorded 916,156 presenze in 2025. Exactly half of them fell in July and August. November through March accounts for 0.4% of the year.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <p style=\"margin:18px 0 0;font:400 16px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Villasimius ha registrato 916.156 presenze nel 2025. Esattamente la met\u00e0 si concentra a luglio e agosto. Da novembre a marzo si registra lo 0,4% dell'anno.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 0 0\">\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">OCTOBER, FROM THE UK AND THE US<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">OTTOBRE, DA REGNO UNITO E STATI UNITI<\u002Fdiv><\u002Fsc-if>\n          <div style=\"font:400 56px\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF;margin-top:18px\">4.9%<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <p style=\"margin:18px 0 0;font:400 16px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">October is already 76.8% foreign, but Germany and Switzerland alone make up 51.8% of it. English-speaking visitors are the market the shoulder season does not have.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <p style=\"margin:18px 0 0;font:400 16px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Ottobre \u00e8 gi\u00e0 straniero al 76,8%, ma Germania e Svizzera da sole ne rappresentano il 51,8%. Il pubblico anglofono \u00e8 il mercato che manca alla bassa stagione.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 0 0\">\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">OCTOBER GROWTH, 2024 TO 2025<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">CRESCITA DI OTTOBRE, 2024 SU 2025<\u002Fdiv><\u002Fsc-if>\n          <div style=\"font:400 56px\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF;margin-top:18px\">+14.6%<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <p style=\"margin:18px 0 0;font:400 16px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">October presenze grew 14.6% on the previous year, against 6.7% in August and 56.3% in April. The shoulder is where the movement already is, and it moves faster than the peak.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <p style=\"margin:18px 0 0;font:400 16px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Le presenze di ottobre sono cresciute del 14,6% sull'anno precedente, contro il 6,7% di agosto e il 56,3% di aprile. La bassa stagione \u00e8 dove il movimento c'\u00e8 gi\u00e0, e si muove pi\u00f9 in fretta del picco.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:22px 0 0;font:400 12.5px\u002F1.6 'Calibri','Arial',sans-serif;color:#8C99AE\">Source: Osservatorio del Turismo, Artigianato e Commercio, Regione Autonoma della Sardegna. Movimenti turistici 2025, dati comunali per mese, open data CC-BY 4.0. Villasimius figures calculated from the published municipal dataset. DMO protocol: Interreg Marittimo, progetto STRATUS.<\u002Fp>\n      <div style=\"margin-top:80px;display:grid;grid-template-columns:1fr 0.72fr;gap:64px;align-items:center\">\n        <div style=\"border-left:2px solid #C4785A;padding-left:38px\">\n          <div style=\"font:400 clamp(30px,3.2vw,46px)\u002F1.22 'Palatino Linotype',Palatino,serif;color:#FFFFFF;font-style:italic\">The commitment to extend the season is already on paper.<\u002Fdiv>\n          <div style=\"width:100px;height:2px;background:#C4785A;margin:28px 0 16px\"><\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <div style=\"font:700 12px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898\">DMO PROTOCOL 2018 \u00b7 COMUNE DI VILLASIMIUS, AMP CAPO CARBONARA, CONSORZIO ALBERGHIERO \u00b7 SOURCE: INTERREG MARITTIMO \u002F STRATUS<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <div style=\"font:700 12px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898\">PROTOCOLLO DMO 2018 \u00b7 COMUNE DI VILLASIMIUS, AMP CAPO CARBONARA, CONSORZIO ALBERGHIERO \u00b7 FONTE: INTERREG MARITTIMO \u002F STRATUS<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.12);padding:32px\">\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <p style=\"margin:0;font:400 17px\u002F1.62 'Calibri','Arial',sans-serif;color:#E8DCC8\">An audience that does not yet come in October cannot be <em style=\"color: rgb(255, 255, 255); font-style: normal;\">captured<\u002Fem> by a listing, because there is nothing there to rank. It has to be <em style=\"color: rgb(196, 120, 90); font-style: normal;\">created<\u002Fem>, by people it already follows. Our community is English-speaking creators who live in Italy all year, which is the one thing a production flown in for four days in August can never be.<\u002Fp>\n        <\u002Fsc-if><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Early results\" style=\"padding:0 40px;border-top:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"max-width:1240px;margin:0 auto;min-height:140px;padding:34px 0;display:flex;align-items:center;gap:44px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 100%;font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:2.6px;color:#B0A898\">EVERY MEASURED CAMPAIGN HAS MOVED PEOPLE, NOT JUST VIEWS<\u002Fdiv>\n      <div style=\"flex:1 1 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px\">\n        <div>\n          <div style=\"font:400 clamp(34px,3vw,44px)\u002F1 'Palatino Linotype',Palatino,serif;color:#E8DCC8\">9.2x<\u002Fdiv>\n          <div style=\"margin-top:10px;font:400 13.5px\u002F1.5 'Calibri','Arial',sans-serif;color:#B0A898\">Story booking stickers against the carousel, Eating Europe<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:4            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">Story booking stickers out-converted carousels, 0.458% against 0.162% CTR<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">Gli sticker di prenotazione nelle Story hanno convertito pi\u00f9 dei caroselli, 0,458% contro 0,162% di CTR<\u002Fp><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #C4785A;padding:22px 0 0\">\n            <div style=\"font:400 clamp(38px,3.2vw,50px)\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">3<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">bookings confirmed by the operator via SARAH15, with the code live to mid-October; tracked bookings are a floor<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">prenotazioni confermate dall'operatore con SARAH15, codice attivo fino a met\u00e0 ottobre; le prenotazioni tracciate sono un minimo<\u002Fp><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #C4785A;padding:22px 0 0\">\n            <div style=\"font:400 clamp(38px,3.2vw,50px)\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">46.0%<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">skip rate on her best branded Reel, against 59.1% typical<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">skip rate sul suo miglior Reel brandizzato, contro il 59,1% abituale<\u002Fp><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #C4785A;padding:22px 0 0\">\n            <div style=\"font:400 clamp(38px,3.2vw,50px)\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">45%<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">of the carousel audience in the United States, against 22% Italy<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">            <p style=\"margin:16px 0 0;font:400 14.5px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">dell'audience del carosello negli Stati Uniti, contro il 22% in Italia<\u002Fp><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;margin-top:52px\">\n        <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">WHAT DROVE IT<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">COSA HA FUNZIONATO<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:26px;margin-top:22px\">\n            <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Stickers are the most efficient click<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">In-frame booking stickers converted at 0.458%, 2.8x the carousel's bio-link path.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Gli sticker sono il click pi\u00f9 efficiente<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Gli sticker di prenotazione nel frame hanno convertito allo 0,458%, 2,8x il percorso link-in-bio del carosello.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n            <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Carousels carry the volume<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">54 of 84 link clicks came through the carousels' link-in-bio route: high-intent viewers tapped to the profile and through to booking.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">I caroselli portano il volume<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">54 degli 84 click sul link sono passati dal link in bio dei caroselli: spettatori ad alta intenzione hanno toccato il profilo e poi la prenotazione.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n            <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Short-form gets seen. Long-form gets saved.<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">The two longest Reels drove 77% of Reel saves from 25% of Reel views. Carousels saved five times better than Reels, and the same pattern held on TikTok.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Il formato breve fa vedere. Il formato lungo fa salvare.<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">I due Reel pi\u00f9 lunghi hanno generato il 77% dei salvataggi dei Reel con il 25% delle views. I caroselli hanno salvato cinque volte meglio dei Reel, e lo stesso schema si \u00e8 visto su TikTok.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">AUDIENCE DELIVERED<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <div style=\"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#B0A898\">AUDIENCE RAGGIUNTA<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:26px;margin-top:22px\">\n            <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Reach beyond her following<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">53 to 67% of Reel views came from non-followers.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Portata oltre il suo following<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Dal 53 al 67% delle views dei Reel viene da non-follower.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n            <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Women, decisively<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">59 to 84% of the audience on every asset. That is the bachelorette, anniversary and group-trip audience.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Donne, con decisione<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Dal 59 all'84% dell'audience su ogni asset, in linea con il segmento celebrazioni e viaggi di gruppo.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n            <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Core age 25 to 54<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Roughly 76% of the carousel audience; disposable income, peak travel-planning years.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">              <div style=\"font:700 19px\u002F1.3 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Fascia centrale 25\u201354<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Circa il 76% dell'audience del carosello; reddito disponibile, anni di picco nella pianificazione dei viaggi.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px\">\n          <sc-if value=\"{{ has_work_lucibello }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:2 t }}\" hint-placeholder-val=\"{{ false }}\">      <div style=\"font:700 13px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">06 \u00b7 COME LAVORIAMO<\u002Fdiv>\n      <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 40px\"><\u002Fdiv>\n      <h2 style=\"margin:0;font:400 clamp(32px,3.6vw,56px)\u002F1.14 'Palatino Linotype',Palatino,serif;letter-spacing:1px;color:#FFFFFF\">Come lavoriamo<\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:780px;font:400 18px\u002F1.65 'Calibri','Arial',sans-serif;color:#E8DCC8\">Nessun roster fisso. Ogni campagna si costruisce sul suo brief.<\u002Fp><\u002Fsc-if>\n\n      <div style=\"position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px;margin-top:60px\">\n        <div style=\"position:absolute;left:0;right:0;top:0;height:1px;background:#C4785A;opacity:0.35\"><\u002Fdiv>\n        <div style=\"background:#1B3057;border-top:2px solid #C4785A;padding:26px 24px 30px 0\">\n          <div style=\"font:400 32px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">01<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Brief<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">The client's objective, target audience, budget band and content needs, written with the agency or the brand.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Brief<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Obiettivo del cliente, target, fascia di budget e necessit\u00e0 di contenuto, definiti con l'agenzia o con il brand.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#1B3057;border-top:2px solid #C4785A;padding:26px 24px 30px 0\">\n          <div style=\"font:400 32px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">02<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Open call<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">The brief goes to the community. Creators who fit the region and the subject apply, and TCC invites where the brief calls for a specific voice.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Open call<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Il brief va alla community. I creator in linea con regione e tema si candidano, e TCC invita quando il brief richiede una voce specifica.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#1B3057;border-top:2px solid #C4785A;padding:26px 24px 30px 0\">\n          <div style=\"font:400 32px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">03<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Shortlist<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">TCC screens applicants on audience alignment, content fit and budget, and verifies each shortlisted creator's audience analytics and recent performance. The client selects with performance estimates attached.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Shortlist<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">TCC valuta le candidature su allineamento di audience, fit di contenuto e budget, e verifica analytics e performance recenti di ogni creator in shortlist. Il cliente scegle con le stime di performance allegate.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#1B3057;border-top:2px solid #C4785A;padding:26px 24px 30px 0\">\n          <div style=\"font:400 32px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">04<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Production<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">TCC contracts and briefs every creator; content is delivered against the brief with TCC review.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Produzione<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">TCC contrattualizza e briefa ogni creator; i contenuti sono consegnati sul brief con revisione TCC.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#1B3057;border-top:2px solid #C4785A;padding:26px 24px 30px 0\">\n          <div style=\"font:400 32px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">05<\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Report<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">One consolidated performance report per activation, and the renewal conversation.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">          <h3 style=\"margin:20px 0 12px;font:400 25px\u002F1.15 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Report<\u002Fh3>\n          <p style=\"margin:0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Un report di performance consolidato per attivazione, e la conversazione di rinnovo.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">      <p style=\"margin:44px 0 0;font:400 20px\u002F1.5 'Calibri','Arial',sans-serif;color:#E8DCC8\">The community is the pool. The shortlist is the output.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <p style=\"margin:44px 0 0;font:400 20px\u002F1.5 'Calibri','Arial',sans-serif;color:#E8DCC8\">La community \u00e8 il bacino. La shortlist \u00e8 il prodotto.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"opportunities\" data-screen-label=\"Upcoming opportunities\" style=\"padding:130px 40px;border-top:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"max-width:1240px;margin:0 auto\">\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">      <div style=\"font:700 13px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">07 \u00b7 UPCOMING OPPORTUNITIES<\u002Fdiv>\n      <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 36px\"><\u002Fdiv>\n      <h2 style=\"margin:0;font:400 clamp(32px,3.4vw,52px)\u002F1.14 'Palatino Linotype',Palatino,serif;letter-spacing:1px;color:#FFFFFF\">Coming up at The Collective.<\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:780px;font:400 18px\u002F1.65 'Calibri','Arial',sans-serif;color:#E8DCC8;text-wrap:pretty\">Live properties across the roster and the community, open to brand partners now.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <div style=\"font:700 13px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">07 \u00b7 OPPORTUNIT\u00c0 IN ARRIVO<\u002Fdiv>\n      <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 36px\"><\u002Fdiv>\n      <h2 style=\"margin:0;font:400 clamp(32px,3.4vw,52px)\u002F1.14 'Palatino Linotype',Palatino,serif;letter-spacing:1px;color:#FFFFFF\">Opportunit\u00e0 in arrivo<\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:780px;font:400 18px\u002F1.65 'Calibri','Arial',sans-serif;color:#E8DCC8;text-wrap:pretty\">Progetti attivi nel roster e nella community, aperti ai brand partner da subito.<\u002Fp><\u002Fsc-if>\n      <div style=\"margin-top:34px;text-align:right;font:700 10.5px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:2.4px;color:#B0A898\">{{ oppsUpdated }}<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;margin-top:16px\">\n        <sc-for list=\"{{ opps }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <div style=\"background:#243D6B;border-top:2px solid #C4785A;padding:32px 30px 30px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font:400 clamp(24px,2.1vw,30px)\u002F1.18 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">{{ o.name }}<\u002Fdiv>\n            <div style=\"font:700 10.5px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:2.6px;color:#C4785A\">{{ o.origin }}<\u002Fdiv>\n            <p style=\"margin:0;font:400 15px\u002F1.62 'Calibri','Arial',sans-serif;color:#E8DCC8;text-wrap:pretty\">{{ o.description }}<\u002Fp>\n            <div style=\"font:700 10.5px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:2.2px;color:#B0A898;text-transform:uppercase\">{{ o.when }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:4px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.12)\">\n              <sc-for list=\"{{ o.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:flex-start;gap:12px\">\n                  <span style=\"flex:none;width:14px;height:1.5px;background:#C4785A;margin-top:10px\"><\u002Fspan>\n                  <span style=\"font:400 14.5px\u002F1.5 'Calibri','Arial',sans-serif;color:#E8DCC8\">{{ opt.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:auto;padding-top:20px;font:italic 400 12.5px\u002F1.5 'Calibri','Arial',sans-serif;color:#B0A898\">{{ o.status }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">      <div style=\"margin-top:30px;display:flex;gap:10px\"><span style=\"flex:none;color:#C4785A\">\u00b7<\u002Fspan><span style=\"font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:2.4px;color:#B0A898\">SCOPE AND FEES ARE QUOTED PER OPPORTUNITY<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <div style=\"margin-top:30px;display:flex;gap:10px\"><span style=\"flex:none;color:#C4785A\">\u00b7<\u002Fspan><span style=\"font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:2.4px;color:#B0A898\">PERIMETRO E COMPENSI SONO QUOTATI PER OGNI OPPORTUNIT\u00c0<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"options\" data-screen-label=\"Options\" style=\"padding:130px 40px;border-top:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"max-width:1240px;margin:0 auto\">\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">      <div style=\"font:700 13px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">08 \u00b7 PARTNERSHIP OPTIONS<\u002Fdiv>\n      <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 3 al',sans-serif;letter-spacing:3px;color:#C4785A;border-bottom:1px solid rgba(196,120,90,0.45);padding-bottom:5px\">READ THE FULL ANALYSIS \u2192<\u002Fa><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <a href=\"https:\u002F\u002Fthecostieracollective.com\u002Fperspectives\u002Fnaples-not-a-postcard\" target=\"_blank\" rel=\"noopener\" style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#C4785A;border-bottom:1px solid rgba(196,120,90,0.45);padding-bottom:5px\">LEGGI L'ANALISI COMPLETA \u2192<\u002Fa><\u002Fsc-if>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">      <span style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898\">ROOTED IN SOUTHERN ITALY. CREATING FOR THE WORLD.<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <span style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898\">RADICATI NEL SUD ITALIA. CREANDO PER IL MONDO.<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440}}\">\nconst TAB_BASE = \"background:transparent;border:0;padding:18px 26px;font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;cursor:pointer;margin-bottom:-1px;\";\nconst LANG_BASE = \"background:transparent;border:0;padding:9px 13px;font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:2.4px;cursor:pointer;\";\n\nconst SUBJ = {\n  \u002F\u002F handle, combined following in K\n  aOnly: [['ireneinsicily',135],['acostaamalfitana',90],['dreamofitaly',63],['alyssasabundance',39],['chiaramagix',36],['amalfimoons',35],['mako__go',24],['travelwithruba',13],['pugliadaydream',13],['worldadventurr',9],['welcome2sorrento',9],['alinapodb',8],['stephanie.inbetween',3],['sunshine.kaydream',2],['thesiciliandiary',0.4]],\n  ab:    [['e
