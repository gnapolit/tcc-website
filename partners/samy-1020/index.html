document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

)\"><\u002Fdiv>\n    <div style=\"position:absolute;left:6%;bottom:12%;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,0.06)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1240px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.15fr 0.85fr;gap:72px;align-items:center\">\n      <div>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">        <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">PREPARED FOR SAMY<\u002Fdiv>\n        <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 40px\"><\u002Fdiv>\n        <h1 style=\"margin:0;font:400 clamp(46px,5.4vw,86px)\u002F1.02 'Palatino Linotype',Palatino,'Book Antiqua',serif;letter-spacing:1px;color:#FFFFFF;text-wrap:balance\">International creators based in Italy, for your clients' <em style=\"font-style:italic;color:#C4785A\">Italian<\u002Fem> moments.<\u002Fh1>\n        <div style=\"width:168px;height:2.5px;background:#C4785A;margin:44px 0 28px\"><\u002Fdiv>\n        <p style=\"margin:0;max-width:560px;font:400 19px\u002F1.62 'Calibri','Arial',sans-serif;color:#E8DCC8;text-wrap:pretty\">60+ international creators across six regions of Southern Italy, an extended network of creators beyond the South, and managed talent. Every casting is built on the brief and objectives, reaching international audiences.<\u002Fp>\n        <div style=\"display:flex;gap:14px;margin-top:44px;flex-wrap:wrap\">\n          <a href=\"#contact\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#1B3057;background:#C4785A;padding:18px 30px\" style-hover=\"background:#E8DCC8\">START A CONVERSATION<\u002Fa>\n          <a href=\"#network\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#E8DCC8;border:1px solid rgba(255,255,255,0.22);padding:18px 30px\" style-hover=\"border-color:#C4785A;color:#FFFFFF\">SEE THE NETWORK<\u002Fa>\n        <\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">        <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">CREATOR AGENCY · SUD ITALIA<\u002Fdiv>\n        <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 40px\"><\u002Fdiv>\n        <h1 style=\"margin:0;font:400 clamp(46px,5.4vw,86px)\u002F1.02 'Palatino Linotype',Palatino,'Book Antiqua',serif;letter-spacing:1px;color:#FFFFFF;text-wrap:balance\">Campagne fatte <em style=\"font-style:italic;color:#C4785A\">con<\u002Fem> il Sud Italia — non su di esso.<\u002Fh1>\n        <div style=\"width:168px;height:2.5px;background:#C4785A;margin:44px 0 28px\"><\u002Fdiv>\n        <p style=\"margin:0;max-width:560px;font:400 19px\u002F1.62 'Calibri','Arial',sans-serif;color:#E8DCC8;text-wrap:pretty\">Gestiamo creator internazionali che vivono davvero qui: una community di 60 creator in sei regioni, e un roster gestito. I brand ottengono accesso culturale, non uno sfondo.<\u002Fp>\n        <div style=\"display:flex;gap:14px;margin-top:44px;flex-wrap:wrap\">\n          <a href=\"#contact\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#1B3057;background:#C4785A;padding:18px 30px\" style-hover=\"background:#E8DCC8\">INIZIAMO A PARLARE<\u002Fa>\n          <a href=\"#network\" style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#E8DCC8;border:1px solid rgba(255,255,255,0.22);padding:18px 30px\" style-hover=\"border-color:#C4785A;color:#FFFFFF\">SCOPRI LA RETE<\u002Fa>\n        <\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:relative;aspect-ratio:4\u002F5;border:1px solid rgba(255,255,255,0.1)\">\n        <image-slot id=\"hero-portrait\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop hero image — creator on location, Amalfi \u002F Naples\" src=\"26ff90d8-32dc-45e1-bbd9-00d5c387a373\"><\u002Fimage-slot>\n        <div style=\"position:absolute;left:-1px;bottom:-1px;background:#1B3057;border-top:1px solid rgba(255,255,255,0.1);border-right:1px solid rgba(255,255,255,0.1);padding:16px 22px;pointer-events:none\">\n          <div style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#C4785A\">EST. 2026 · NAPOLI<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"americascup\" data-screen-label=\"Case study\" style=\"padding:130px 40px;border-top:1px solid rgba(255,255,255,0.08)\">\n    <div style=\"max-width:1240px;margin:0 auto\">\n      <div style=\"font:700 13px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:6px;color:#C4785A\">01 · CASE STUDY · AMERICA'S CUP NAPOLI<\u002Fdiv>\n      <div style=\"width:168px;height:1.5px;background:#C4785A;opacity:0.5;margin:18px 0 40px\"><\u002Fdiv>\n      <h2 style=\"margin:0;font:400 clamp(32px,3.6vw,56px)\u002F1.14 'Palatino Linotype',Palatino,serif;letter-spacing:1px;color:#FFFFFF;max-width:1000px\">Louis Vuitton 38th America's Cup <i>Preliminary Regatta<\u002Fi><\u002Fh2>\n      <p style=\"margin:26px 0 0;max-width:860px;font:400 18px\u002F1.65 'Calibri','Arial',sans-serif;color:#E8DCC8\">Naples, 25 to 27 September 2026, with content from 6 September to 4 October. Six international creators from our network covered the regatta as accredited media, telling the story to audiences planning their trip to Naples for the Cup in 2027.<\u002Fp>\n\n      <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898;margin-top:72px\">WHAT WE DID<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;margin-top:22px\">\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 28px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">01<\u002Fdiv>\n          <h3 style=\"margin:18px 0 0;font:400 23px\u002F1.2 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Casting<\u002Fh3>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Creators shortlisted on reach, relevance and audience fit, with verified analytics for each profile.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 28px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">02<\u002Fdiv>\n          <h3 style=\"margin:18px 0 0;font:400 23px\u002F1.2 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">One point of contact<\u002Fh3>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">TCC ran all communication with the organizers, so the event team dealt with one channel, not six.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 28px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">03<\u002Fdiv>\n          <h3 style=\"margin:18px 0 0;font:400 23px\u002F1.2 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Creator brief<\u002Fh3>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Logistics, daily rotations and a clear disclosure standard. No shot list: each creator told the story for their own audience.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 28px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">04<\u002Fdiv>\n          <h3 style=\"margin:18px 0 0;font:400 23px\u002F1.2 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Measurement<\u002Fh3>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Every post tracked through our campaign monitoring, with creator insights collected in a single round and consolidated into one report.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n      <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898;margin-top:72px\">RESULTS<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;margin-top:22px\">\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 56px\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">6<\u002Fdiv>\n          <div style=\"font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#C4785A;margin-top:14px\">CREATORS ACCREDITED AS MEDIA<\u002Fdiv>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Daily rotations on the water, at the AC38 Club at Castel dell’Ovo, and in the Fan Village.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 56px\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">167<\u002Fdiv>\n          <div style=\"font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#C4785A;margin-top:14px\">POSTS<\u002Fdiv>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Pre-event, the three race days and post-event, across Instagram, TikTok and YouTube.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 56px\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">545K<\u002Fdiv>\n          <div style=\"font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#C4785A;margin-top:14px\">VIEWS<\u002Fdiv>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">On Reels, TikTok videos and Shorts. Fully organic, with no paid media.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0\">\n          <div style=\"font:400 56px\u002F1 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">17.8K<\u002Fdiv>\n          <div style=\"font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#C4785A;margin-top:14px\">ENGAGEMENTS<\u002Fdiv>\n          <p style=\"margin:12px 0 0;font:400 15px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Likes, comments, saves and shares, as each platform reports them.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <p style=\"margin:40px 0 0;max-width:900px;font:400 18px\u002F1.6 'Calibri','Arial',sans-serif;color:#E8DCC8\">Every creator who posted counts the United States among their top two audience markets.<\u002Fp>\n\n      <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898;margin-top:72px\">RESULTS BY CREATOR<\u002Fdiv>\n      <div style=\"overflow-x:auto;margin-top:26px\">\n        <table style=\"width:100%;border-collapse:collapse;min-width:760px\">\n          <thead><tr><th style=\"padding:0 14px 14px;text-align:left;font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#B0A898;white-space:nowrap\">CREATOR<\u002Fth><th style=\"padding:0 14px 14px;text-align:left;font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#B0A898;white-space:nowrap\">TIER<\u002Fth><th style=\"padding:0 14px 14px;text-align:left;font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#B0A898;white-space:nowrap\">PLATFORMS<\u002Fth><th style=\"padding:0 14px 14px;text-align:left;font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#B0A898;white-space:nowrap;text-align:right\">POSTS<\u002Fth><th style=\"padding:0 14px 14px;text-align:left;font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#B0A898;white-space:nowrap;text-align:right\">VIEWS<\u002Fth><th style=\"padding:0 14px 14px;text-align:left;font:700 10px\u002F1.4 'Cal ial',sans-serif;color:#E8DCC8;white-space:nowrap\"><\u002Ftd><\u002Ftr><\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p style=\"margin:18px 0 0;max-width:1000px;font:400 12.5px\u002F1.5 'Calibri','Arial',sans-serif;color:#B0A898\">Content posted 6 September to 4 October 2026. Source: TCC campaign monitoring, refreshed 19 October 2026. Creator content only; TCC owned channels excluded. Top markets are third-party audience estimates on each creator’s primary platform. *Sarah’s audience split is under review against her own insights.<\u002Fp>\n\n      <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898;margin-top:72px\">WHAT THE CONTENT TAUGHT US<\u002Fdiv>\n      <p style=\"margin:22px 0 0;max-width:900px;font:400 18px\u002F1.65 'Calibri','Arial',sans-serif;color:#E8DCC8\">Three patterns from this campaign, and what each one means when we brief creators for a brand.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:40px\">\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0;display:flex;flex-direction:column\">\n          <div style=\"font:400 64px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">7x<\u002Fdiv>\n          <h3 style=\"margin:16px 0 0;font:400 24px\u002F1.2 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Edutainment outperformed trend-led content<\u002Fh3>\n          <p style=\"margin:12px 0 0;font:400 14.5px\u002F1.6 'Calibri','Arial',sans-serif;color:#B0A898\">On site, posts that informed and entertained, explaining what viewers were watching, averaged 625 engagements each, against 92 for trend-led posts.<\u002Fp>\n          <div style=\"margin-top:18px;padding:16px 18px;background:rgba(196,120,90,0.10);border-left:2px solid #C4785A\">\n            <div style=\"font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#C4785A\">WHAT IT MEANS FOR A BRIEF<\u002Fdiv>\n            <p style=\"margin:8px 0 0;font:400 15px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">Brief creators to teach the audience something about the product or the moment. One edutainment post earned the engagement of about seven trend-led posts.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0;display:flex;flex-direction:column\">\n          <div style=\"font:400 64px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">2.4x<\u002Fdiv>\n          <h3 style=\"margin:16px 0 0;font:400 24px\u002F1.2 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">The story keeps going after the event<\u002Fh3>\n          <p style=\"margin:12px 0 0;font:400 14.5px\u002F1.6 'Calibri','Arial',sans-serif;color:#B0A898\">Posts after the regatta averaged 398 engagements, against 169 for teaser content before it.<\u002Fp>\n          <div style=\"margin-top:18px;padding:16px 18px;background:rgba(196,120,90,0.10);border-left:2px solid #C4785A\">\n            <div style=\"font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#C4785A\">WHAT IT MEANS FOR A BRIEF<\u002Fdiv>\n            <p style=\"margin:8px 0 0;font:400 15px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">Plan budget beyond the event days. Recap and planning content is where interest peaks, not the countdown.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #C4785A;padding:26px 24px 0 0;display:flex;flex-direction:column\">\n          <div style=\"font:400 64px\u002F1 'Palatino Linotype',Palatino,serif;color:#C4785A\">2x<\u002Fdiv>\n          <h3 style=\"margin:16px 0 0;font:400 24px\u002F1.2 'Palatino Linotype',Palatino,serif;color:#FFFFFF\">Tone should change with the moment<\u002Fh3>\n          <p style=\"margin:12px 0 0;font:400 14.5px\u002F1.6 'Calibri','Arial',sans-serif;color:#B0A898\">After the event, personal and reflective posts averaged 407 engagements, against 197 for educational recaps.<\u002Fp>\n          <div style=\"margin-top:18px;padding:16px 18px;background:rgba(196,120,90,0.10);border-left:2px solid #C4785A\">\n            <div style=\"font:700 10px\u002F1.4 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#C4785A\">WHAT IT MEANS FOR A BRIEF<\u002Fdiv>\n            <p style=\"margin:8px 0 0;font:400 15px\u002F1.55 'Calibri','Arial',sans-serif;color:#E8DCC8\">Sequence the content: explain while it is happening, then let creators tell their own story once it is over.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <p style=\"margin:18px 0 0;max-width:1000px;font:400 12.5px\u002F1.5 'Calibri','Arial',sans-serif;color:#B0A898\">Average engagements per post, creator content, 6 September to 4 October 2026. Observed on this campaign; we test these patterns again on every new brief.<\u002Fp>\n      <div style=\"font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898;margin-top:72px\">FROM THE REGATTA<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#FFFFFF;border:1px solid rgba(255,255,255,0.14);overflow:hidden\">\n            <iframe src=\"https:\u002F\u002Fwww.instagram.com\u002Fp\u002FDdv8l0wo3BT\u002Fembed\u002F\" loading=\"lazy\" scrolling=\"no\" allowtransparency=\"true\" frameborder=\"0\" style=\"display:block;width:100%;height:620px;border:0\"><\u002Fiframe>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font:700 11px\u002F1.5 'Calibri','Arial',sans-serif;letter-spacing:2.5px;color:#C4785A\"><a href=\"https:\u002F\u002Fwww.instagram.com\u002Fp\u002FDdv8l0wo3BT\u002F\" target=\"_blank\" rel=\"noopener\" style=\"color:#C4785A\">@iambrianneb<\u002Fa><span style=\"color:#B0A898\">52.1K views<\u002Fspan><\u002Fdiv>\n        <\u002 5A;border-bottom:1px solid rgba(196,120,90,0.45);padding-bottom:5px\">READ THE FULL ANALYSIS →<\u002Fa><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <a href=\"https:\u002F\u002Fthecostieracollective.com\u002Fperspectives\u002Fnaples-not-a-postcard\" target=\"_blank\" rel=\"noopener\" style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;color:#C4785A;border-bottom:1px solid rgba(196,120,90,0.45);padding-bottom:5px\">LEGGI L'ANALISI COMPLETA →<\u002Fa><\u002Fsc-if>\n<sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">      <span style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898\">ROOTED IN SOUTHERN ITALY. CREATING FOR THE WORLD.<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ it }}\" hint-placeholder-val=\"{{ false }}\">      <span style=\"font:700 10px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:4px;color:#B0A898\">RADICATI NEL SUD ITALIA. CREANDO PER IL MONDO.<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440}}\">\nconst TAB_BASE = \"background:transparent;border:0;padding:18px 26px;font:700 12px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:3px;cursor:pointer;margin-bottom:-1px;\";\nconst LANG_BASE = \"background:transparent;border:0;padding:9px 13px;font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:2.4px;cursor:pointer;\";\n\nconst SUBJ = {\n  \u002F\u002F handle, combined following in K\n  aOnly: [['ireneinsicily',135],['acostaamalfitana',90],['dreamofitaly',63],['alyssasabundance',39],['chiaramagix',36],['amalfimoons',35],['mako__go',24],['travelwithruba',13],['pugliadaydream',13],['worldadventurr',9],['welcome2sorrento',9],['alinapodb',8],['stephanie.inbetween',3],['sunshine.kaydream',2],['thesiciliandiary',0.4]],\n  ab:    [['everydayallegra',248],['jaidinthelife',66],['ssofid',78],['giusybella_in_sicily',14],['italyandback',10],['girlinsardinia',6],['msbritaly',3]],\n  bOnly: [['abcuinitaly',142],['joe.in.italia',142],['byemily_rose',93],['ambymathur',89],['signora_secci',38],['oursicilydream',37],['fusetravels',34],['americanmominthemed',25],['deeinsicily',20],['thegopopolofamily',16],['violla_sokolova',9],['jenniferrippard',7],['pigtailsandpasta',6],['flordemanifestadora',4],['caterinainsorrento',2],['jehannamarie',2],['najahfawaz',2],['spilledspritz',0.3]],\n  ac:    [],\n  bc:    [['skylermapes',99],['theallyfromcali',98],['sillygirlsnacks',42],['danielle_in_sicily',16],['skaterade',2]],\n  none:  [['wild_one_85',28],['nikkitaylors_ladolcevita',18],['mariahcrossmanweddings',11],['louis_nabil_djalili',7],['bellamagliulo',2]]\n};\n\u002F\u002F regions carried over from the CCC directory set used by region-map.js\nconst REGION_OF = {\n  byemily_rose: 'Campania', ssofid: 'Campania', ambymathur: 'Campania', sillygirlsnacks: 'Campania',\n  ireneinsicily: 'Sicilia', abcuinitaly: 'Sicilia', theallyfromcali: 'Sicilia', chiaramagix: 'Sicilia',\n  everydayallegra: 'Puglia', jaidinthelife: 'Puglia', travelwithruba: 'Puglia', pugliadaydream: 'Puglia',\n  signora_secci: 'Sardegna', americanmominthemed: 'Sardegna', worldadventurr: 'Sardegna',\n  skylermapes: 'Calabria', thegopopolofamily: 'Calabria',\n  'joe.in.italia': 'Abruzzo'\n};\nconst DELIVERED = ['sillygirlsnacks','pugliadaydream','ssofid','travelwithruba','jenniferrippard','wild_one_85'];\n\u002F\u002F only these creators are named on the page — everyone else stays anonymous at rest and on hover\nconst NAMED = ['sillygirlsnacks','pugliadaydream','ssofid','travelwithruba','jenniferrippard','wild_one_85','ambymathur','byemily_rose','everydayallegra','theallyfromcali','ireneinsicily','chiaramagix','mako__go','jaidinthelife','skylermapes'];\nconst LEAD = {\n  A:  ['ireneinsicily', 'chiaramagix', 'mako__go', 'travelwithruba'],\n  AB: ['everydayallegra', 'jaidinthelife', 'ssofid'],\n  B:  ['ambymathur', 'byemily_rose', 'theallyfromcali', 'sillygirlsnacks'],\n  C:  ['sillygirlsnacks', 'skylermapes', 'theallyfromcali']\n};\nconst ZONE_META = {\n  A:  { name: 'Italy Travel', count: 22 },\n  AB: { name: 'Italy Travel and Italian Life', count: 7 },\n  B:  { name: 'Italian Life', count: 30 },\n  C:  { name: 'Food and Wine', count: 5 }\n};\nconst tierOf = k => (k < 10 ? 'UNDER 10K' : k < 50 ? '10K TO 50K' : '50K+');\nconst TIKTOK = ['abcuinitaly','skylermapes','theallyfromcali','joe.in.italia','ambymathur','byemily_rose','sillygirlsnacks','fusetravels','ssofid','everydayallegra','dreamofitaly','violla_sokolova','pigtailsandpasta','jenniferrippard','danielle_in_sicily','americanmominthemed','thegopopolofamily','chiaramagix','ireneinsicily','girlinsardinia','mariahcrossmanweddings'];\n\u002F\u002F phyllotaxis packing keeps each zone's dots inside its lens without hand-placing 49 points\nconst packZone = (list, cx, cy, R) => list.map((it, i) => {\n  const n = list.length;\n  const a = i * 2.399963;\n  const rr = n === 1 ? 0 : R * Math.sqrt((i + 0.5) \u002F n);\n  return { h: '@' + it[0], k: it[1], x: +(cx + rr * Math.cos(a)).toFixed(1), y: +(cy + rr * Math.sin(a)).toFixed(1) };\n});\nconst dotR = k => (k < 10 ? 4 : k < 50 ? 6 : 9);\nconst fmtK = k => (k < 1 ? (k * 1000) + '' : k + 'K');\n\nclass Component extends DCLogic {\n  state = {\n    zone: 'B', tk: false, tip: null,\n    lang: 'en', tier: 'local', region: 'all',\n    navShown: false, active: 'americascup',\n    openSarah: false, openJamal: false,\n    members: 0, following: 0, regions: 0, talent: 0, counted: false,\n    name: '', brand: '', goal: ''\n  };\n\n  componentDidMount() {\n    this._nav = () => {\n      const y = window.scrollY || 0;\n      const shown = y > (window.innerHeight * 0.72);\n      let active = this.state.active;\n      const ids = ['americascup','what','network','talent','process','contact'];\n      for (let i = 0; i < ids.length; i++) {\n        const el = document.getElementById(ids[i]);\n        if (el && el.getBoundingClientRect().top <= 120) active = ids[i];\n      }\n      if (shown !== this.state.navShown || active !== this.state.active) {\n        this.setState({ navShown: shown, active: active });\n      }\n    };\n    window.addEventListener('scroll', this._nav, { passive: true });\n    this._nav();\n    if (!this._stats) return;\n    this._io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (e.isIntersecting && !this.state.counted) {\n          this.setState({ counted: true });\n          this._count();\n        }\n      });\n    }, { threshold: 0.4 });\n    this._io.observe(this._stats);\n  }\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._nav) window.removeEventListener('scroll', this._nav);\n  }\n\n  _count() {\n    const dur = 1400, t0 = performance.now();\n    const tick = now => {\n      const p = Math.min(1, (now - t0) \u002F dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      this.setState({\n        members: Math.round(60 * e),\n        following: Math.round(22 * e) \u002F 10,\n        regions: Math.round(6 * e),\n        talent: Math.round(1 * e)\n      });\n      if (p < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const navLink = active => \"font:700 11px\u002F1 'Calibri','Arial',sans-serif;letter-spacing:2px;white-space:nowrap;color:\" + (active ? '#C4785A' : '#B0A898');\n    const CCC = [\n      { h: 'travelwithruba', n: 'Ruba', r: 'puglia', p: 'PUGLIA',\n        en: 'Travel storytelling across Puglia', it: 'Racconto di viaggio in Puglia',\n        bEn: 'ITALY AMBASSADOR AWARDS NOMINEE · TOURISM, PUGLIA', bIt: 'CANDIDATA ITALY AMBASSADOR AWARDS · TURISMO, PUGLIA' },\n      { h: 'everydayallegra', n: 'Allegra', r: 'puglia', p: 'LECCE · PUGLIA',\n        en: 'Italy relocation & travel', it: 'Trasfer
